# For the Render dashboard, use the settings in docs/RENDER.md.
# For a Blueprint, select classroom-survey/render.yaml as the Blueprint path.
services:
  - type: web
    name: classroom-survey
    runtime: static
    rootDir: classroom-survey
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
